<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Login | SkillJobs</title>
	<link rel="stylesheet" href="/css/style.css">
</head>

<body class="auth-body"><a class="brand auth-brand" href="/">Skill<span>Jobs</span></a>
	<main class="auth-card">
		<p class="eyebrow">WELCOME BACK</p>
		<h1>Sign in to your account</h1>
		<p class="muted">Continue your career journey.</p>
		<form id="loginForm"><label>Email<input type="email" name="email" required
					placeholder="you@example.com"></label><label>Password<input type="password" name="password"
					required></label><button class="btn btn-primary full" type="submit">Sign in</button>
			<p id="error" class="error"></p>
		</form>
		<p class="auth-foot">New to SkillJobs? <a href="/register.html">Create account</a></p>
		<div class="demo-box"><b>Demo accounts</b><br>Admin: admin@skilljobs.local / Admin@12345<br>Recruiter:
			recruiter@skilljobs.local / Recruiter@123<br>Candidate: candidate@skilljobs.local / Candidate@123</div>
	</main>
	<script src="/js/app.js"></script>
</body>

</html>
